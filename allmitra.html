<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semua Mitra - Market Nusantara</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-background: #050505; 
            --color-surface-1: #0f1115;  
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #94a3b8; 
            
            --color-cyan: #22d3ee; 
            --color-violet: #8b5cf6;

            --color-glass-bg: rgba(15, 23, 42, 0.6); 
            --color-glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text-primary);
            overflow-x: hidden;
        }

        /* --- BACKGROUND SPACE --- */
        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: #000;
        }

        /* --- NAVBAR --- */
        .navbar-glass {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-glass-border);
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
        }

        /* --- MITRA CARD STYLES --- */
        .accent-own { --card-accent: #8b5cf6; --card-accent-dim: rgba(139, 92, 246, 0.4); }
        .accent-pt { --card-accent: #3b82f6; --card-accent-dim: rgba(59, 130, 246, 0.4); }
        .accent-tk { --card-accent: #eab308; --card-accent-dim: rgba(234, 179, 8, 0.4); }
        .accent-pp { --card-accent: #10b981; --card-accent-dim: rgba(16, 185, 129, 0.4); }
        .accent-default { --card-accent: var(--color-cyan); --card-accent-dim: rgba(34, 211, 238, 0.4); } 

        .mitra-card {
            height: 380px; 
            width: 100%;
            background-color: #0d0f14; 
            border-radius: 1rem;
            position: relative;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
        }

        .mitra-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--card-accent);
            box-shadow: 0 0 15px var(--card-accent);
            opacity: 0.7;
        }

        .mitra-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-accent);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--card-accent-dim);
        }

        .mitra-image-wrapper {
            position: relative;
            z-index: 2;
            height: 45%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .mitra-img {
            width: 90px; 
            height: 90px;
            object-fit: cover;
            border-radius: 50%; 
            border: 3px solid rgba(255,255,255,0.1);
            padding: 3px;
            background: #0d0f14;
            transition: all 0.4s ease;
        }

        .mitra-card:hover .mitra-img {
            transform: scale(1.1);
            border-color: var(--card-accent);
            box-shadow: 0 0 20px var(--card-accent-dim);
        }
        
        .mitra-status {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.65rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--color-text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }
        
        .mitra-status-dot { width: 6px; height: 6px; border-radius: 50%; }

        .mitra-info {
            position: relative;
            z-index: 10;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            padding: 1.25rem;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(13, 15, 20, 0.8) 50%, transparent 100%);
        }

        .mitra-role-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--card-accent);
            display: block;
            margin-bottom: 0.25rem;
        }

        .mitra-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
            text-transform: capitalize;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .mitra-stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: var(--color-text-secondary);
        }
        
        .mitra-stat-item { display: flex; align-items: center; gap: 4px; }
        .mitra-action-bar { margin-top: auto; }

        .btn-feed {
            background-color: rgba(255,255,255,0.05); 
            color: #fff; 
            padding: 0.5rem;
            border-radius: 0.5rem; 
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%; 
            border: 1px solid var(--card-accent); 
            transition: all 0.3s ease;
        }
        
        .btn-feed:hover {
            background-color: var(--card-accent);
            color: #000; 
            box-shadow: 0 0 15px var(--card-accent);
        }

        /* --- FILTER BUTTONS --- */
        .mitra-filter-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2rem;
        }
        .mitra-filter-btn {
            padding: 0.5rem 1.25rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: var(--color-text-secondary); cursor: pointer;
        }
        .mitra-filter-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .mitra-filter-btn.active {
            background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #8b5cf6 100%);
            color: black; border-color: transparent; box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
        }

        .skeleton { background: rgba(255,255,255,0.05); animation: pulse 1.5s infinite; border-radius: 1rem; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .glitch-text { animation: glitch 3s infinite; }
        @keyframes glitch { 0% { text-shadow: 2px 0 var(--color-cyan); } 5% { text-shadow: -2px 0 var(--color-violet); } 10% { text-shadow: none; } 100% { text-shadow: none; } }

        @media (max-width: 768px) {
            .mitra-filter-container {
                overflow-x: auto;
                justify-content: flex-start;
                flex-wrap: nowrap;
                -ms-overflow-style: none; scrollbar-width: none;
            }
            .mitra-filter-container::-webkit-scrollbar { display: none; }
            .mitra-card { height: 320px; }
            .mitra-img { width: 75px; height: 75px; }
            .btn-feed { font-size: 0.7rem; padding: 0.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <div style="position: fixed; inset: 0; background: linear-gradient(to top, #050505 0%, rgba(34, 211, 238, 0.05) 100%); z-index: -1;"></div>

    <nav class="navbar-glass">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="assets/profile/nusantaralogo.webp" alt="Logo" class="h-8 w-8 rounded-full border border-white/20">
                <div class="leading-none">
                    <span class="block font-bold text-white text-sm">Market Nusantara</span>
                    <span class="block text-[10px] text-cyan-400 font-mono tracking-widest">MITRA DATABASE</span>
                </div>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Kembali
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-20 relative z-10">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-white mb-2 glitch-text">SEMUA MITRA</h1>
            <p class="text-gray-400 text-sm max-w-lg mx-auto">
                Eksplorasi seluruh partner dan mitra Market Nusantara yang siap melayani kebutuhan digital Anda.
            </p>
        </div>

        <div class="mitra-filter-container px-2">
            <button class="mitra-filter-btn active" data-filter="all">Semua</button>
            <button class="mitra-filter-btn" data-filter="pp">PP</button>
            <button class="mitra-filter-btn" data-filter="own">OWN</button>
            <button class="mitra-filter-btn" data-filter="pt">PT</button>
            <button class="mitra-filter-btn" data-filter="tk">TK</button>
        </div>

        <!-- Grid Container -->
        <div id="all-mitra-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-5">
            <!-- Loading Skeletons -->
            <div class="skeleton w-full h-[320px] md:h-[380px]"></div>
            <div class="skeleton w-full h-[320px] md:h-[380px]"></div>
            <div class="skeleton w-full h-[320px] md:h-[380px]"></div>
            <div class="skeleton w-full h-[320px] md:h-[380px] hidden sm:block"></div>
            <div class="skeleton w-full h-[320px] md:h-[380px] hidden lg:block"></div>
        </div>

    </main>

    <footer class="mt-12 py-6 border-t border-white/10 text-center text-sm text-gray-500 bg-black/50 backdrop-blur-sm">
        &copy; 2025 Market Nusantara. Semua Hak Cipta Dilindungi.
    </footer>

    <script>
        // --- SPACE BACKGROUND ANIMATION ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = Array.from({ length: 100 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2,
            speed: Math.random() * 0.2 + 0.1,
            opacity: Math.random()
        }));

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y -= star.speed;
                if (star.y < 0) star.y = height;
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- DATA LOGIC ---
        const container = document.getElementById('all-mitra-container');
        let allMitraData = [];

        const roleLabels = {
            'own': { label: 'OWNER', class: 'accent-own' },
            'pt': { label: 'PARTNER', class: 'accent-pt' },
            'tk': { label: 'TANGAN KANAN', class: 'accent-tk' },
            'pp': { label: 'PAID PROMOTE', class: 'accent-pp' }
        };

        const renderMitraGrid = (filter = 'all') => {
            container.innerHTML = '';
            
            const filteredData = filter === 'all' 
                ? allMitraData 
                : allMitraData.filter(m => m.role === filter);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Belum ada mitra di kategori ini.</div>`;
                return;
            }

            let htmlContent = '';
            filteredData.forEach(mitra => {
                const roleInfo = roleLabels[mitra.role] || { label: 'MEMBER', class: 'accent-default' };
                const status = Math.random() > 0.3 ? 'Online' : 'Away';
                const statusColor = status === 'Online' ? '#4ade80' : '#fbbf24';

                htmlContent += `
                    <div class="mitra-card ${roleInfo.class}">
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.05)_1px,transparent_0)] bg-[length:20px_20px] opacity-30 pointer-events-none"></div>
                        
                        <div class="mitra-status">
                            <div class="mitra-status-dot" style="background-color: ${statusColor}; box-shadow: 0 0 5px ${statusColor}"></div>
                            ${status}
                        </div>
                        
                        <div class="mitra-image-wrapper">
                            <img src="${mitra.foto}" alt="${mitra.nama}" class="mitra-img" onerror="this.src='https://placehold.co/200x200/1c1c1c/a1a1aa?text=${mitra.nama.substring(0,2)}'">
                        </div>
                        
                        <div class="mitra-info">
                            <div>
                                <span class="mitra-role-label">${roleInfo.label}</span>
                                <h3 class="mitra-name">${mitra.nama}</h3>
                                
                                <div class="mitra-stats-row">
                                    <div class="mitra-stat-item">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                        <span>4.9</span>
                                    </div>
                                    <div class="mitra-stat-item">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        <span>Verified</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mitra-action-bar">
                                <a href="${mitra.link}" target="_blank" class="btn-feed">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.487 5.235 3.487 8.413.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.269.655 4.502 1.908 6.387l-.473 1.724 1.743-.459z"/></svg>
                                    Hubungi
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
        };

        const loadMitraData = async () => {
            try {
                const response = await fetch('DATABASE/mitra.json');
                allMitraData = await response.json();
                renderMitraGrid('all');
            } catch (error) {
                console.error('Error loading data:', error);
                container.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Gagal memuat data mitra.</div>';
            }
        };

        loadMitraData();

        // Filter Functionality
        const filterBtns = document.querySelectorAll('.mitra-filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMitraGrid(btn.getAttribute('data-filter'));
            });
        });

    </script>
</body>
</html>
