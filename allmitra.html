<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semua Mitra - Market Nusantara</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-background: #050505; 
            --color-surface-1: #0f1115;  
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #94a3b8; 
            
            --color-cyan: #22d3ee; 
            --color-violet: #8b5cf6;

            --color-glass-bg: rgba(15, 23, 42, 0.6); 
            --color-glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text-primary);
            overflow-x: hidden;
        }

        /* --- BACKGROUND SPACE --- */
        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: #000;
        }

        /* --- NAVBAR --- */
        .navbar-glass {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-glass-border);
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
        }

        /* --- MITRA LIST CARD STYLES --- */
        .accent-own { --card-accent: #8b5cf6; --card-accent-dim: rgba(139, 92, 246, 0.2); }
        .accent-pt { --card-accent: #3b82f6; --card-accent-dim: rgba(59, 130, 246, 0.2); }
        .accent-tk { --card-accent: #eab308; --card-accent-dim: rgba(234, 179, 8, 0.2); }
        .accent-pp { --card-accent: #10b981; --card-accent-dim: rgba(16, 185, 129, 0.2); }
        .accent-default { --card-accent: var(--color-cyan); --card-accent-dim: rgba(34, 211, 238, 0.2); } 

        .mitra-list-card {
            background-color: rgba(13, 15, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-accent); 
            transition: all 0.3s ease; 
        }

        .mitra-list-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px var(--card-accent-dim), inset 0 0 10px rgba(255,255,255,0.02);
            background-color: rgba(13, 15, 20, 0.95);
        }

        .btn-hubungi {
            background-color: transparent; 
            color: var(--card-accent); 
            border: 1px solid var(--card-accent); 
            transition: all 0.3s ease;
        }
        
        .btn-hubungi:hover {
            background-color: var(--card-accent);
            color: #000; 
            box-shadow: 0 0 15px var(--card-accent-dim);
        }

        /* --- FILTER BUTTONS --- */
        .mitra-filter-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2.5rem;
        }
        .mitra-filter-btn {
            padding: 0.5rem 1.25rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: var(--color-text-secondary); cursor: pointer;
        }
        .mitra-filter-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .mitra-filter-btn.active {
            background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #8b5cf6 100%);
            color: black; border-color: transparent; box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
        }

        .skeleton { background: rgba(255,255,255,0.05); animation: pulse 1.5s infinite; border-radius: 0.75rem; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 0.8; } 100% { opacity: 0.4; } }
        
        .glitch-text { animation: glitch 3s infinite; }
        @keyframes glitch { 0% { text-shadow: 2px 0 var(--color-cyan); } 5% { text-shadow: -2px 0 var(--color-violet); } 10% { text-shadow: none; } 100% { text-shadow: none; } }

        @media (max-width: 768px) {
            .mitra-filter-container {
                overflow-x: auto;
                justify-content: flex-start;
                flex-wrap: nowrap;
                -ms-overflow-style: none; scrollbar-width: none;
            }
            .mitra-filter-container::-webkit-scrollbar { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <div style="position: fixed; inset: 0; background: linear-gradient(to top, #050505 0%, rgba(34, 211, 238, 0.05) 100%); z-index: -1;"></div>

    <nav class="navbar-glass">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="assets/profile/nusantaralogo.webp" alt="Logo" class="h-8 w-8 rounded-full border border-white/20">
                <div class="leading-none">
                    <span class="block font-bold text-white text-sm">Market Nusantara</span>
                    <span class="block text-[10px] text-cyan-400 font-mono tracking-widest">MITRA DATABASE</span>
                </div>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Kembali
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-20 relative z-10">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-white mb-2 glitch-text">SEMUA MITRA</h1>
            <p class="text-gray-400 text-sm max-w-lg mx-auto">
                Eksplorasi seluruh partner dan mitra Market Nusantara yang siap melayani kebutuhan digital Anda.
            </p>
        </div>

        <div class="mitra-filter-container px-2">
            <button class="mitra-filter-btn active" data-filter="all">Semua</button>
            <button class="mitra-filter-btn" data-filter="pp">PP</button>
            <button class="mitra-filter-btn" data-filter="own">OWN</button>
            <button class="mitra-filter-btn" data-filter="pt">PT</button>
            <button class="mitra-filter-btn" data-filter="tk">TK</button>
        </div>

        <!-- Grid Container: Menggunakan 1 kolom untuk mobile, 2 kolom untuk desktop -->
        <div id="all-mitra-container" class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-w-5xl mx-auto">
            <!-- Loading Skeletons -->
            <div class="skeleton w-full h-[80px]"></div>
            <div class="skeleton w-full h-[80px]"></div>
            <div class="skeleton w-full h-[80px]"></div>
            <div class="skeleton w-full h-[80px]"></div>
            <div class="skeleton w-full h-[80px]"></div>
            <div class="skeleton w-full h-[80px]"></div>
        </div>

    </main>

    <footer class="mt-12 py-6 border-t border-white/10 text-center text-sm text-gray-500 bg-black/50 backdrop-blur-sm">
        &copy; 2025 Market Nusantara. Semua Hak Cipta Dilindungi.
    </footer>

    <script>
        // --- SPACE BACKGROUND ANIMATION ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = Array.from({ length: 100 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2,
            speed: Math.random() * 0.2 + 0.1,
            opacity: Math.random()
        }));

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y -= star.speed;
                if (star.y < 0) star.y = height;
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- DATA LOGIC ---
        const container = document.getElementById('all-mitra-container');
        let allMitraData = [];

        const roleLabels = {
            'own': { label: 'OWNER', class: 'accent-own' },
            'pt': { label: 'PARTNER', class: 'accent-pt' },
            'tk': { label: 'TANGAN KANAN', class: 'accent-tk' },
            'pp': { label: 'PAID PROMOTE', class: 'accent-pp' }
        };

        const renderMitraGrid = (filter = 'all') => {
            container.innerHTML = '';
            
            const filteredData = filter === 'all' 
                ? allMitraData 
                : allMitraData.filter(m => m.role === filter);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Belum ada mitra di kategori ini.</div>`;
                return;
            }

            let htmlContent = '';
            filteredData.forEach(mitra => {
                const roleInfo = roleLabels[mitra.role] || { label: 'MEMBER', class: 'accent-default' };
                const status = Math.random() > 0.3 ? 'Online' : 'Away';
                const statusColor = status === 'Online' ? '#4ade80' : '#fbbf24';

                htmlContent += `
                    <div class="mitra-list-card ${roleInfo.class} relative flex items-center justify-between p-3.5 md:p-4 rounded-xl group overflow-hidden">
                        <!-- Pola Background Transparan -->
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.05)_1px,transparent_0)] bg-[length:20px_20px] opacity-30 pointer-events-none"></div>
                        
                        <!-- Konten Kiri (Avatar & Info) -->
                        <div class="flex items-center gap-3.5 relative z-10 w-full">
                            
                            <!-- Avatar -->
                            <div class="relative flex-shrink-0">
                                <img src="${mitra.foto}" alt="${mitra.nama}" class="w-12 h-12 md:w-14 md:h-14 rounded-full border-2 border-[var(--card-accent)] object-cover bg-black" onerror="this.src='https://placehold.co/100x100/1c1c1c/a1a1aa?text=${mitra.nama.substring(0,2)}'">
                                <!-- Status Indicator (Online/Away) -->
                                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-[2.5px] border-[#0d0f14]" style="background-color: ${statusColor};"></div>
                            </div>
                            
                            <!-- Text Info -->
                            <div class="flex flex-col flex-1 min-w-0 pr-2">
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    <h3 class="font-bold text-white text-[0.95rem] md:text-base leading-tight truncate group-hover:text-[var(--card-accent)] transition-colors">${mitra.nama}</h3>
                                    <svg class="w-3.5 h-3.5 text-cyan-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                
                                <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-[0.7rem] md:text-xs text-gray-400 mt-0.5">
                                    <span class="font-bold tracking-wider" style="color: var(--card-accent);">${roleInfo.label}</span>
                                    <span class="text-gray-600">•</span>
                                    <div class="flex items-center gap-0.5">
                                        <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                        <span class="font-medium">4.9</span>
                                    </div>
                                    <span class="text-gray-600">•</span>
                                    <span class="font-medium">${status}</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Konten Kanan (Tombol) -->
                        <div class="relative z-10 flex-shrink-0 ml-2">
                            <a href="${mitra.link}" target="_blank" class="btn-hubungi flex items-center justify-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[0.7rem] md:text-[0.75rem] font-bold uppercase tracking-wider">
                                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.487 5.235 3.487 8.413.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.269.655 4.502 1.908 6.387l-.473 1.724 1.743-.459z"/></svg>
                                Hubungi
                            </a>
                        </div>
                        
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
        };

        const loadMitraData = async () => {
            try {
                const response = await fetch('DATABASE/mitra.json');
                allMitraData = await response.json();
                renderMitraGrid('all');
            } catch (error) {
                console.error('Error loading data:', error);
                container.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Gagal memuat data mitra.</div>';
            }
        };

        loadMitraData();

        // Filter Functionality
        const filterBtns = document.querySelectorAll('.mitra-filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMitraGrid(btn.getAttribute('data-filter'));
            });
        });

    </script>
</body>
</html>
