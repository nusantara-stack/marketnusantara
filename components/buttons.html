<!-- ================= TEMPLATE SECTION TOMBOL ================= -->
<section class="relative w-full flex flex-col justify-center items-center px-4 md:px-12 pt-4 md:pt-6 pb-10 z-10">
    <div id="dynamic-button-list" class="w-[85%] max-w-[320px] md:max-w-[360px] mx-auto flex flex-col gap-6">
        <div class="text-center text-[10px] text-royal font-mono animate-pulse border border-royal border-dashed p-4">
            [ SYSTEM ] Mengunduh data server...
        </div>
    </div>
</section>

<!-- ================= LOGIKA RENDER TOMBOL ================= -->
<script>
    (async function renderNusantaraButtons() {
        const listContainer = document.getElementById('dynamic-button-list');
        try {
            const responseJson = await fetch('database/button.json');
            if (!responseJson.ok) throw new Error('File database/button.json tidak ditemukan');
            const dataKategori = await responseJson.json();

            let htmlContent = '';

            dataKategori.forEach(kategori => {
                htmlContent += `
                    <div class="flex flex-col gap-2.5">
                        <div class="flex items-center gap-2 mb-1 opacity-80">
                            <div class="h-[1px] bg-royal/50 flex-grow"></div>
                            <span class="font-mono text-[9px] tracking-[0.2em] text-royal font-bold uppercase text-center mx-2 whitespace-nowrap">${kategori.nama_kategori}</span>
                            <div class="h-[1px] bg-royal/50 flex-grow"></div>
                        </div>
                        <div class="flex flex-col gap-2.5 md:gap-3">
                `;

                kategori.tombol.forEach(btn => {
                    // ===============================================
                    // CEK TOMBOL SPLIT (BERSEBELAHAN DENGAN '|')
                    // ===============================================
                    if (btn.judul && btn.judul.includes('|')) {
                        const juduls = btn.judul.split('|').map(s => s.trim());
                        const ikons = btn.ikon ? btn.ikon.split('|').map(s => s.trim()) : [];
                        const urls = btn.url ? btn.url.split('|').map(s => s.trim()) : [];
                        const temas = btn.tema ? btn.tema.split('|').map(s => s.trim()) : [];
                        const aksis = btn.aksi ? btn.aksi.split('|').map(s => s.trim()) : [];

                        htmlContent += `<div class="flex items-center gap-2 md:gap-3 w-full">`;
                        
                        for (let i = 0; i < juduls.length; i++) {
                            let tema = temas[i] || 'dark'; 
                            let ikon = ikons[i] || 'ph-link'; 
                            let aksi = aksis[i] || '';
                            let url = urls[i] || '#';
                            
                            // LOGIKA FIX: Jika ada Aksi, matikan fungsi URL dan New Tab
                            let urlAttr = '';
                            if (aksi !== '') {
                                urlAttr = `href="javascript:void(0)" onclick="${aksi}"`;
                            } else {
                                urlAttr = `href="${url}" target="_blank"`;
                            }
                            
                            let themeClass, clipClass;
                            if (tema === 'accent') {
                                themeClass = 'bg-accent text-dark border-transparent hover:border-accent hover:bg-white';
                                clipClass = 'clip-button';
                            } else if (tema === 'royal') {
                                themeClass = 'bg-royal text-white border-transparent hover:border-royal hover:bg-white hover:text-royal';
                                clipClass = 'clip-button-reverse';
                            } else {
                                themeClass = 'bg-dark text-white border-transparent hover:border-dark hover:bg-gray-800';
                                clipClass = 'clip-button';
                            }

                            htmlContent += `
                                <a ${urlAttr} class="btn-hover-fx flex-1 block ${themeClass} px-2 py-2.5 md:py-3 ${clipClass} transition-colors border-2 group shadow-sm">
                                    <div class="flex items-center justify-center gap-1.5 md:gap-2">
                                        <i class="ph-bold ${ikon} text-base md:text-xl group-hover:animate-bounce"></i>
                                        <span class="btn-text font-bold uppercase text-[9px] md:text-xs italic tracking-wide truncate">${juduls[i]}</span>
                                    </div>
                                </a>
                            `;
                        }
                        htmlContent += `</div>`; 

                    } else {
                        // ===============================================
                        // RENDER TOMBOL PENUH (1 BARIS UTUH)
                        // ===============================================
                        let themeClass, clipClass;
                        if (btn.tema === 'accent') {
                            themeClass = 'bg-accent text-dark border-transparent hover:border-accent hover:bg-white';
                            clipClass = 'clip-button';
                        } else if (btn.tema === 'royal') {
                            themeClass = 'bg-royal text-white border-transparent hover:border-royal hover:bg-white hover:text-royal';
                            clipClass = 'clip-button-reverse';
                        } else {
                            themeClass = 'bg-dark text-white border-transparent hover:border-dark hover:bg-gray-800';
                            clipClass = 'clip-button';
                        }

                        let aksi = btn.aksi || '';
                        let urlAttr = '';
                        
                        // LOGIKA FIX: Jika ada Aksi, matikan fungsi URL dan New Tab
                        if (aksi !== '') {
                            urlAttr = `href="javascript:void(0)" onclick="${aksi}"`;
                        } else {
                            urlAttr = `href="${btn.url || '#'}" target="_blank"`;
                        }

                        htmlContent += `
                            <a ${urlAttr} class="btn-hover-fx block w-full ${themeClass} px-3 py-2.5 md:py-3 md:px-5 ${clipClass} transition-colors border-2 group shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2 md:gap-3">
                                        <i class="ph-bold ${btn.ikon} text-base md:text-xl group-hover:animate-bounce"></i>
                                        <span class="btn-text font-bold uppercase text-[10px] md:text-sm italic tracking-wide">${btn.judul}</span>
                                    </div>
                                    <i class="ph-bold ph-arrow-right text-[10px] md:text-sm"></i>
                                </div>
                            </a>
                        `;
                    }
                });

                htmlContent += `
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = htmlContent;

        } catch (error) {
            console.error("Gagal memuat database/button.json:", error);
            listContainer.innerHTML = '<div class="text-[10px] text-red-500 font-mono text-center p-4 border border-red-500 border-dashed">[ ERROR ] Koneksi database tombol terputus.</div>';
        }
    })();
</script>
