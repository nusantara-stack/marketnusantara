<!-- ================= MODAL DONATE OVERLAY ================= -->
<div id="donate-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-dark/80 backdrop-blur-sm opacity-0 transition-opacity duration-300">
    
    <!-- Kotak Donate GFX -->
    <div id="donate-box" class="relative w-full max-w-[320px] bg-dark border-2 border-accent shadow-[0_0_40px_rgba(255,215,0,0.25)] transform scale-95 transition-transform duration-300" style="clip-path: polygon(25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%, 0 25px);">
        
        <!-- Header -->
        <div class="bg-accent text-dark p-5 pb-4 relative bg-stripes bg-opacity-20">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-mono tracking-widest text-dark font-bold flex items-center gap-1.5 opacity-80">
                    <span class="w-1.5 h-1.5 bg-dark animate-pulse"></span> SYS.QR // V1.0
                </span>
                <!-- Tombol Tutup -->
                <button onclick="closeDonate()" class="text-dark hover:text-white transition-colors">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>
            <h2 class="font-display font-black text-2xl uppercase tracking-wider mt-1">Support <span class="text-white drop-shadow-md italic">Creator</span></h2>
        </div>

        <!-- Body -->
        <div class="p-6 flex flex-col items-center gap-4">
            
            <p class="text-xs font-mono text-gray-400 text-center uppercase tracking-wider">
                Scan QRIS di bawah ini untuk memberikan dukungan.
            </p>

            <!-- Container untuk Render Canvas QR Code -->
            <div class="p-1 border border-royal shadow-[0_0_20px_rgba(65,105,225,0.2)] bg-[#020617]" style="clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);">
                <div id="fancy-qr-canvas" class="w-[200px] h-[200px] flex items-center justify-center pointer-events-none">
                    <!-- Animasi Loading sementara sebelum script termuat -->
                    <span id="qr-loading" class="text-[10px] text-royal font-mono animate-pulse">Menghasilkan QR...</span>
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="closeDonate()" class="w-full bg-dark text-white border border-gray-600 font-bold font-display text-sm uppercase tracking-widest p-3 hover:bg-gray-800 transition-colors mt-2 flex justify-center items-center gap-2" style="clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);">
                Selesai
            </button>
            
        </div>
    </div>
</div>

<!-- ================= SCRIPT LOGIKA DONATE & FANCY QR ================= -->
<script>
    // 1. Animasi saat pertama kali dimuat
    setTimeout(() => {
        document.getElementById('donate-modal').classList.remove('opacity-0');
        document.getElementById('donate-box').classList.remove('scale-95');
    }, 10);

    // 2. Fungsi Menutup Donate
    window.closeDonate = function() {
        document.getElementById('donate-modal').classList.add('opacity-0');
        document.getElementById('donate-box').classList.add('scale-95');
        
        setTimeout(() => {
            const wrapper = document.getElementById('donate-wrapper');
            if (wrapper) wrapper.innerHTML = '';
        }, 300);
    }

    // 3. Fungsi Render Fancy QR Code
    function generateFancyQR() {
        // Tentukan warna sesuai request (Kuning & Royal Blue)
        const color1 = '#FFD700'; // Kuning Accent
        const color2 = '#4169E1'; // Royal Blue

        const qrCode = new QRCodeStyling({
            width: 200,
            height: 200,
            data: "4d8845a5-9210-4e4a-9bb0-5228f6d2c234",
            margin: 5,
            dotsOptions: {
                type: "classy-rounded", 
                gradient: {
                    type: "linear",
                    rotation: 45,
                    colorStops: [
                        { offset: 0, color: color1 },
                        { offset: 1, color: color2 }
                    ]
                }
            },
            backgroundOptions: {
                gradient: {
                    type: "linear",
                    rotation: 45,
                    colorStops: [
                        { offset: 0, color: "#020617" },
                        { offset: 1, color: "#0f172a" }  
                    ]
                }
            },
            image: "https://i.postimg.cc/Y90497yM/20260402-005340.png",
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 6,
                imageSize: 0.3
            },
            cornersSquareOptions: {
                type: "extra-rounded",
                gradient: {
                    type: "linear",
                    rotation: 45,
                    colorStops: [
                        { offset: 0, color: color1 },
                        { offset: 1, color: color2 }
                    ]
                }
            },
            cornersDotOptions: {
                type: "classy-rounded", 
                gradient: {
                    type: "linear",
                    rotation: 45,
                    colorStops: [
                        { offset: 0, color: color1 },
                        { offset: 1, color: color2 }
                    ]
                }
            }
        });

        // Hapus teks loading dan letakkan QR Code di div container
        const qrContainer = document.getElementById("fancy-qr-canvas");
        if(qrContainer) {
            qrContainer.innerHTML = ''; 
            qrCode.append(qrContainer);
        }
    }

    // 4. Mekanisme Memuat Library QR Code secara Dinamis
    if (typeof QRCodeStyling === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js';
        script.onload = generateFancyQR;
        document.head.appendChild(script);
    } else {
        // Jika library sudah pernah dimuat, langsung jalankan render QR
        generateFancyQR();
    }
</script>
