<!-- ================= MODAL DONATE OVERLAY ================= -->
<div id="donate-modal" class="fixed inset-0 z-[60] flex items-end justify-center bg-dark/85 backdrop-blur-sm opacity-0 transition-opacity duration-300">

    <div id="donate-box" class="relative w-full max-w-[430px] scale-95 transition-transform duration-300">

        <!-- Karakter Mengintip -->
        <img src="assets/images/character3.webp"
             alt="Character Mascot"
             class="absolute -top-[200px] left-1/2 -translate-x-1/2 w-[250px] z-10 drop-shadow-[0_10px_25px_rgba(0,0,0,0.8)] pointer-events-none"
             draggable="false"
             loading="lazy">

        <!-- Card Utama -->
        <div class="relative z-20 bg-dark border-t border-royal/50 shadow-[0_-20px_60px_rgba(65,105,225,0.3)] w-full px-6 pt-24 pb-8"
             style="clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px);">

            <!-- Tombol Tutup -->
            <button onclick="closeDonate()"
                    class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-gray-500 hover:text-accent border border-gray-700/60 hover:border-accent/50 transition-all clip-button">
                <i class="ph-bold ph-x text-sm"></i>
            </button>

            <!-- Label Sistem -->
            <div class="absolute top-4 left-4 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 bg-accent animate-pulse rounded-full"></span>
                <span class="font-mono text-[8px] text-royal/80 tracking-[0.25em] uppercase">Donasi // Support</span>
            </div>

            <!-- Header Branding -->
            <div class="text-center mb-5">
                <h2 class="font-bebas text-[30px] text-white uppercase tracking-widest leading-none">
                    MARKET <span class="text-accent">NUSANTARA</span>
                </h2>
                <p class="text-[8px] font-mono text-gray-500 mt-1 tracking-[0.2em] uppercase">Scan QRIS di bawah untuk berdonasi</p>
            </div>

            <!-- Frame QRIS dengan Corner Brackets -->
            <div class="relative mx-auto w-[210px] aspect-square bg-white/5 border border-royal/30 p-2">
                <span class="absolute top-1.5 left-1.5 w-3 h-3 border-t-2 border-l-2 border-accent"></span>
                <span class="absolute top-1.5 right-1.5 w-3 h-3 border-t-2 border-r-2 border-accent"></span>
                <span class="absolute bottom-1.5 left-1.5 w-3 h-3 border-b-2 border-l-2 border-accent"></span>
                <span class="absolute bottom-1.5 right-1.5 w-3 h-3 border-b-2 border-r-2 border-accent"></span>
                <img src="assets/images/qris.webp"
                     alt="QRIS Donasi"
                     class="w-full h-full object-cover pointer-events-none"
                     loading="lazy">
            </div>

            <!-- Nameplate -->
            <div class="flex items-center gap-2 mt-4 px-3 py-2.5 border border-royal/20 bg-royal/5">
                <i class="ph-bold ph-wallet text-accent text-sm"></i>
                <span class="font-mono text-[10px] text-gray-300 uppercase tracking-widest">Market Nusantara</span>
                <div class="flex-grow"></div>
                <span class="font-mono text-[8px] text-royal/60 tracking-widest">QRIS</span>
            </div>

            <!-- Tombol Selesai -->
            <button onclick="closeDonate()"
                    class="mt-4 w-full bg-accent text-dark font-bebas text-base uppercase tracking-widest py-3 clip-button hover:bg-white transition-colors flex items-center justify-center gap-2">
                <i class="ph-bold ph-check-circle"></i> Selesai
            </button>

        </div>
    </div>
</div>

<!-- ================= SCRIPT LOGIKA DONATE ================= -->
<script>
    setTimeout(() => {
        document.getElementById('donate-modal').classList.remove('opacity-0');
        document.getElementById('donate-box').classList.remove('scale-95');
    }, 10);

    window.closeDonate = function() {
        document.getElementById('donate-modal').classList.add('opacity-0');
        document.getElementById('donate-box').classList.add('scale-95');
        setTimeout(() => {
            const wrapper = document.getElementById('donate-wrapper');
            if (wrapper) wrapper.innerHTML = '';
        }, 300);
    }
</script>
