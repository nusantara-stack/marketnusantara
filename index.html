<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara | Link in Bio</title>
    
    <!-- Google Fonts: Chakra Petch untuk elemen tebal/mecha, JetBrains Mono untuk detail teknis -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons untuk Ikon -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal': '#4169E1',    /* Royal Blue */
                        'accent': '#FFD700',   /* Yellow */
                        'dark': '#111827',     /* Almost Black */
                        'light': '#F8FAFC'     /* Off White */
                    },
                    fontFamily: {
                        'display': ['"Chakra Petch"', 'sans-serif'],
                        'mono': ['"JetBrains Mono"', 'monospace'],
                    },
                    backgroundImage: {
                        'stripes': 'repeating-linear-gradient(45deg, #4169E1, #4169E1 2px, transparent 2px, transparent 8px)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom CSS untuk Efek Potongan Khas GFX (Clip Path) */
        .clip-button {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }
        .clip-button-reverse {
            clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
        }
        .clip-card {
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        }
        
        /* Animasi Glitch Sederhana saat Hover */
        .btn-hover-fx:hover .btn-text {
            transform: translateX(5px);
        }
        .btn-text {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Pola Grid Background Lembut */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(65, 105, 225, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(65, 105, 225, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center font-display text-dark selection:bg-accent selection:text-dark">

    <!-- Mobile Container (Max Width untuk format Link-in-Bio) -->
    <main class="relative w-full max-w-[420px] bg-white min-h-screen sm:min-h-[850px] shadow-2xl overflow-hidden bg-grid">
        
        <!-- ================= Hiasan Background GFX ================= -->
        <!-- Label Pojok Kiri Atas -->
        <div class="absolute top-0 left-0 bg-royal text-white font-mono text-[10px] py-1 px-3 z-20 clip-button">
            SYS.READY // V.1.0.4
        </div>
        <!-- Ornamen Lingkaran Kanan Atas -->
        <div class="absolute -top-16 -right-16 w-48 h-48 rounded-full border-2 border-dashed border-gray-300 opacity-50 z-0 animate-[spin_60s_linear_infinite]"></div>
        <div class="absolute top-10 right-10 w-4 h-4 bg-accent rounded-full z-0"></div>

        <!-- ================= HEADER SECTION (HERO KARAKTER) ================= -->
        <header class="relative pt-20 px-6 pb-0 z-10 h-[380px] overflow-hidden">
            
            <!-- Tipografi Raksasa di Belakang (Z-0) -->
            <div class="absolute top-4 right-[-10%] z-0 select-none pointer-events-none opacity-20">
                <h1 class="text-[7rem] font-black italic uppercase leading-[0.8] text-transparent" style="-webkit-text-stroke: 2px #111827;">
                    NUSAN<br>TARA
                </h1>
            </div>

            <!-- Karakter di Kanan (Z-10) -->
            <!-- Menggunakan assets/character1.webp -->
            <img src="assets/character1.webp" 
                 alt="Karakter Nusantara" 
                 class="absolute bottom-0 right-[-10%] w-[320px] max-w-[80%] object-contain z-10 drop-shadow-xl pointer-events-none"
                 onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?ixlib=rb-4.0.3&auto=format&fit=crop&w=350&h=450&q=80'; this.style.opacity='0.2';">

            <div class="flex items-start gap-4 relative z-20">
                <!-- Elemen Vertikal Kiri -->
                <div class="flex flex-col items-center justify-between py-2 border-l-2 border-t-2 border-b-2 border-dark border-dashed w-8 h-32 opacity-80 bg-white/50 backdrop-blur-sm">
                    <span class="text-xs font-mono font-bold rotate-90 whitespace-nowrap translate-y-6">0 0 1</span>
                    <div class="w-full h-8 bg-stripes opacity-50"></div>
                </div>

                <!-- Informasi Profil (Kiri) -->
                <div class="flex-1 max-w-[65%] mt-4">
                    <p class="text-[10px] font-mono tracking-[0.2em] text-royal mb-1 bg-white/80 inline-block px-1 rounded-sm">NETWORK ARCHIVES</p>
                    <h1 class="text-4xl font-black italic uppercase leading-none tracking-tighter mb-2 bg-white/80 inline-block pr-2 rounded-sm">
                        Nusan<br>
                        <span class="text-royal">tara</span>
                    </h1>
                    <div class="bg-white/90 backdrop-blur-sm p-3 border-l-4 border-royal shadow-sm mt-2 rounded-r-md">
                        <p class="text-xs font-medium text-gray-600 leading-tight">
                            Desainer, Kreator, dan Penggemar GFX.
                        </p>
                        <span class="bg-accent text-dark px-1.5 py-0.5 font-mono text-[10px] font-bold mt-2 inline-block shadow-sm">STATUS: ONLINE</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ================= DIAGONAL DIVIDER ================= -->
        <div class="w-full h-12 bg-royal -skew-y-3 transform origin-left flex items-center px-4 relative z-20 shadow-[0_-5px_15px_rgba(0,0,0,0.15)] border-b-4 border-dark mt-4">
            <!-- Teks berjalan ala marquee untuk nuansa tech -->
            <div class="w-full overflow-hidden flex space-x-4">
                <p class="text-accent font-mono text-xs whitespace-nowrap animate-[pulse_2s_ease-in-out_infinite]">
                    >>> DIRECTORY ACCESS GRANTED /// CHOOSE DESTINATION ///
                </p>
            </div>
        </div>

        <!-- ================= LINKS SECTION ================= -->
        <section class="relative pt-12 pb-16 px-6 bg-dark text-white z-10 h-full">
            <!-- Dekorasi Latar Belakang Gelap -->
            <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                <i class="ph-fill ph-hexagon text-9xl text-royal"></i>
            </div>

            <div class="space-y-4 relative z-10">
                
                <!-- Link 1 (Primary / Yellow) -->
                <a href="#" class="btn-hover-fx block w-full bg-accent text-dark p-4 clip-button transition-colors hover:bg-white border-2 border-transparent hover:border-accent group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i class="ph-bold ph-folder-star text-2xl group-hover:animate-bounce"></i>
                            <span class="btn-text font-bold uppercase text-lg italic tracking-wide">Portofolio</span>
                        </div>
                        <i class="ph-bold ph-arrow-right text-xl"></i>
                    </div>
                </a>

                <!-- Link 2 (Royal Blue) -->
                <a href="#" class="btn-hover-fx block w-full bg-royal text-white p-4 clip-button-reverse transition-colors hover:bg-white hover:text-royal border-2 border-transparent hover:border-royal group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i class="ph-bold ph-instagram-logo text-2xl group-hover:-rotate-12 transition-transform"></i>
                            <span class="btn-text font-bold uppercase text-lg italic tracking-wide">Instagram</span>
                        </div>
                        <i class="ph-bold ph-arrow-right text-xl"></i>
                    </div>
                </a>

                <!-- Link 3 (Outline Putih) -->
                <a href="#" class="btn-hover-fx block w-full bg-transparent border-2 border-white text-white p-4 clip-button transition-colors hover:bg-white hover:text-dark group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i class="ph-bold ph-x-logo text-2xl"></i>
                            <span class="btn-text font-bold uppercase text-lg italic tracking-wide">Twitter / X</span>
                        </div>
                        <i class="ph-bold ph-arrow-right text-xl"></i>
                    </div>
                </a>

                <!-- Link 4 (Dotted / Discord) -->
                <a href="#" class="btn-hover-fx block w-full bg-dark border-2 border-dashed border-gray-600 text-gray-300 p-4 transition-colors hover:border-accent hover:text-accent group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i class="ph-bold ph-discord-logo text-2xl"></i>
                            <span class="btn-text font-bold uppercase text-lg italic tracking-wide">Join Discord</span>
                        </div>
                        <span class="font-mono text-xs border border-gray-600 px-2 py-1 rounded-sm group-hover:border-accent">CO-OP</span>
                    </div>
                </a>

            </div>

            <!-- Footer / Detail Dekorasional -->
            <div class="mt-12 pt-6 border-t border-gray-800 flex justify-between items-end opacity-60">
                <div class="flex gap-2">
                    <div class="w-2 h-2 bg-royal"></div>
                    <div class="w-2 h-2 bg-royal"></div>
                    <div class="w-2 h-2 bg-accent"></div>
                </div>
                <div class="text-right font-mono text-[10px] text-gray-500">
                    <p>ID: NST-992-X</p>
                    <p>SYSTEM TERMINAL VER. 2.0</p>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
