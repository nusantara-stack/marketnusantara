<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara | Link in Bio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Dancing+Script:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal': '#4169E1',    /* Royal Blue */
                        'accent': '#FFD700',   /* Yellow */
                        'dark': '#0B0F19',     /* Darker Black for new footer */
                        'light': '#F8FAFC'     /* Off White */
                    },
                    fontFamily: {
                        'display': ['"Chakra Petch"', 'sans-serif'],
                        'mono': ['"JetBrains Mono"', 'monospace'],
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'cursive': ['"Dancing Script"', 'cursive']
                    },
                    backgroundImage: {
                        'stripes': 'repeating-linear-gradient(45deg, #4169E1, #4169E1 2px, transparent 2px, transparent 8px)'
                    }
                }
            }
        }
    </script>

    <style>
        .clip-button {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
        .clip-button-reverse {
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        }
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(65, 105, 225, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(65, 105, 225, 0.05) 1px, transparent 1px);
        }
        .btn-hover-fx:hover .btn-text {
            transform: translateX(4px);
        }
        .btn-text {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
    </style>
</head>
<!-- Menghilangkan padding dan justify agar website 100% fit (rata ujung) dengan layar -->
<body class="bg-white min-h-screen font-display text-dark selection:bg-accent selection:text-dark">

    <!-- Mobile & Desktop Container: Menghapus max-w dan rounded agar melebar penuh -->
    <main class="relative w-full min-h-screen overflow-hidden bg-grid flex flex-col">
        
        <!-- ================= Hiasan Background GFX ================= -->
        <div class="absolute top-0 left-0 bg-royal text-white font-mono text-[8px] md:text-[10px] py-1 px-2 md:py-1.5 md:px-4 z-20 clip-button">
            SYS.READY // V.2.0
        </div>
        <div class="absolute -top-16 -right-16 w-40 h-40 md:w-64 md:h-64 rounded-full border border-dashed border-gray-300 opacity-50 z-0 animate-[spin_60s_linear_infinite]"></div>
        <div class="absolute top-8 right-8 w-3 h-3 md:w-4 md:h-4 bg-accent rounded-full z-0"></div>

        <!-- ================= WRAPPER ATAS-BAWAH ================= -->
        <div class="flex flex-col w-full flex-1 z-10 relative">

            <!-- ================= HEADER SECTION (HERO KARAKTER) ================= -->
            <header class="relative pt-12 px-6 pb-0 w-full h-[450px] md:h-[600px] flex-shrink-0 overflow-hidden flex flex-col items-center justify-center">
                
                <!-- Tipografi Latar Belakang Z-0 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center z-0 pointer-events-none select-none opacity-80 mt-8 md:mt-0">
                    <!-- Teks Sans-Serif Memanjang Vertikal -->
                    <div class="font-bebas text-[110px] md:text-[160px] lg:text-[200px] leading-[0.8] text-transparent tracking-tight flex flex-col items-center" style="-webkit-text-stroke: 1.5px rgba(65, 105, 225, 0.2); transform: scaleY(1.7);">
                        <span>NUSANTARA</span>
                        <span class="text-royal/5" style="-webkit-text-stroke: 1.5px rgba(65, 105, 225, 0.4);">NUSANTARA</span>
                    </div>
                    <!-- Teks Cursive Melintang -->
                    <div class="absolute top-[40%] md:top-[45%] w-[120%] text-center font-cursive text-[70px] md:text-[110px] lg:text-[140px] text-royal/40 -rotate-[8deg] transform -translate-y-1/2 drop-shadow-sm">
                        Nusantara
                    </div>
                </div>

                <!-- Nameplate Info Profil (Nekomiya Style) Z-20 -->
                <div class="absolute top-12 left-5 md:top-20 md:left-12 z-20">
                    <div class="flex items-stretch gap-2">
                        <!-- Bracket Kiri dengan Nomor Vertikal -->
                        <div class="relative w-2.5 border-t-2 border-b-2 border-l-2 border-dark">
                            <span class="absolute top-1/2 -left-2.5 transform -translate-y-1/2 -rotate-90 text-[7px] md:text-[8px] font-mono tracking-[0.2em] text-dark font-bold whitespace-nowrap">0 0 1</span>
                        </div>
                        
                        <!-- Teks Profil -->
                        <div class="py-0.5">
                            <p class="text-[7px] md:text-[9px] font-mono tracking-[0.2em] text-gray-500 mb-0.5 uppercase">Nusantara Archives</p>
                            <h1 class="text-3xl md:text-6xl font-black font-display uppercase leading-[0.85] tracking-tighter text-dark">
                                MARKET<br>NUSANTARA
                            </h1>
                            <p class="text-[9px] md:text-[12px] font-medium text-gray-600 mt-1.5 md:mt-3 max-w-[120px] md:max-w-[180px] leading-snug">
                                Desainer, Kreator, dan Penggemar GFX.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Karakter di Tengah (Z-10) -->
                <img src="assets/images/character1.webp" 
                     alt="Karakter Nusantara" 
                     class="absolute bottom-0 w-[260px] md:w-[450px] max-w-[85%] md:max-w-[95%] object-contain z-10 drop-shadow-xl pointer-events-none">
            </header>

            <!-- ================= SECTION BUTTON / LINKS ================= -->
            <section class="relative w-full flex flex-col justify-center items-center px-6 md:px-12 pt-6 md:pt-12 pb-12 z-10">
                
                <div class="w-full max-w-[420px] flex flex-col gap-4">
                    <!-- Link 1 (Primary / Yellow) -->
                    <a href="#" class="btn-hover-fx block w-full bg-accent text-dark px-4 py-3.5 md:py-4 md:px-6 clip-button transition-colors hover:bg-white border-2 border-transparent hover:border-accent group shadow-sm">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i class="ph-bold ph-folder-star text-xl md:text-2xl group-hover:animate-bounce"></i>
                                <span class="btn-text font-bold uppercase text-sm md:text-base italic tracking-wide">Portofolio</span>
                            </div>
                            <i class="ph-bold ph-arrow-right text-sm md:text-base"></i>
                        </div>
                    </a>

                    <!-- Link 2 (Royal Blue) -->
                    <a href="#" class="btn-hover-fx block w-full bg-royal text-white px-4 py-3.5 md:py-4 md:px-6 clip-button-reverse transition-colors hover:bg-white hover:text-royal border-2 border-transparent hover:border-royal group shadow-sm">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i class="ph-bold ph-instagram-logo text-xl md:text-2xl group-hover:-rotate-12 transition-transform"></i>
                                <span class="btn-text font-bold uppercase text-sm md:text-base italic tracking-wide">Instagram</span>
                            </div>
                            <i class="ph-bold ph-arrow-right text-sm md:text-base"></i>
                        </div>
                    </a>

                    <!-- Link 3 (Dark Theme) -->
                    <a href="#" class="btn-hover-fx block w-full bg-dark text-white px-4 py-3.5 md:py-4 md:px-6 clip-button transition-colors hover:bg-gray-800 border-2 border-transparent hover:border-dark group shadow-sm">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i class="ph-bold ph-x-logo text-xl md:text-2xl"></i>
                                <span class="btn-text font-bold uppercase text-sm md:text-base italic tracking-wide">Twitter / X</span>
                            </div>
                            <i class="ph-bold ph-arrow-right text-sm md:text-base"></i>
                        </div>
                    </a>
                </div>

            </section>
        </div>

        <!-- ================= NEW FOOTER SECTION ================= -->
        <footer class="relative w-full flex flex-col z-20 mt-auto">
            
            <!-- Wedge/Garis Biru Miring -->
            <div class="absolute -top-3 left-0 w-full h-12 md:h-14 bg-royal shadow-[0_-5px_15px_rgba(65,105,225,0.3)]" style="clip-path: polygon(0 100%, 100% 0, 100% 100%); z-10;"></div>
            
            <!-- Dark Container Footer -->
            <!-- Tidak perlu diubah clip-path nya karena efek miringnya akan menyesuaikan dengan lebar elemen -->
            <div class="relative bg-dark w-full flex flex-col pt-12 pb-6 px-6 md:pb-8" style="clip-path: polygon(0 25px, 100% 0, 100% 100%, 0 100%); margin-top: -10px;">
                
                <!-- Title Footer -->
                <div class="flex justify-center items-center gap-3 mt-2 mb-4 md:mb-6">
                    <!-- Icon 4 Garis -->
                    <div class="flex flex-col gap-[3px] w-8 md:w-10 transform -skew-x-[15deg]">
                        <div class="h-[4px] md:h-[5px] w-full bg-white"></div>
                        <div class="h-[4px] md:h-[5px] w-[95%] bg-white"></div>
                        <div class="h-[4px] md:h-[5px] w-[75%] bg-white"></div>
                        <div class="h-[4px] md:h-[5px] w-full bg-white"></div>
                    </div>
                    <!-- Teks Judul -->
                    <h2 class="text-[28px] md:text-[36px] font-black font-display uppercase tracking-widest text-white leading-none mt-1">NUSANTARA</h2>
                </div>

                <!-- Copyright / Detail Bawah -->
                <div class="mt-4 md:mt-6 pt-4 text-center font-mono text-[8px] md:text-[10px] text-gray-500 uppercase tracking-[0.15em] border-t border-gray-800/50">
                    © 2026 NUSANTARA. ALL RIGHTS RESERVED.
                </div>

            </div>
        </footer>

    </main>

</body>
</html>
