<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara | Link in Bio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Dancing+Script:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal': '#4169E1',    /* Royal Blue */
                        'accent': '#FFD700',   /* Yellow */
                        'dark': '#0B0F19',     /* Darker Black for new footer */
                        'light': '#F8FAFC'     /* Off White */
                    },
                    fontFamily: {
                        'display': ['"Chakra Petch"', 'sans-serif'],
                        'mono': ['"JetBrains Mono"', 'monospace'],
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'cursive': ['"Dancing Script"', 'cursive']
                    },
                    backgroundImage: {
                        'stripes': 'repeating-linear-gradient(45deg, #4169E1, #4169E1 2px, transparent 2px, transparent 8px)'
                    }
                }
            }
        }
    </script>

    <style>
        .clip-button {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(65, 105, 225, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(65, 105, 225, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<!-- Mengubah items-center menjadi flex agar bisa di-scroll normal dari atas ke bawah pada layar kecil -->
<body class="bg-gray-900 min-h-screen flex justify-center font-display text-dark selection:bg-accent selection:text-dark">

    <!-- Mobile Container - Disesuaikan agar fit 100% layar (menghapus rounded dan margin) -->
    <main class="relative w-full max-w-[420px] mx-auto bg-white min-h-screen shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden bg-grid flex flex-col">
        
        <!-- ================= Hiasan Background GFX ================= -->
        <div class="absolute top-0 left-0 bg-royal text-white font-mono text-[8px] py-1 px-2 z-20 clip-button">
            SYS.READY // V.2.0
        </div>
        <div class="absolute -top-16 -right-16 w-40 h-40 rounded-full border border-dashed border-gray-300 opacity-50 z-0 animate-[spin_60s_linear_infinite]"></div>
        <div class="absolute top-8 right-8 w-3 h-3 bg-accent rounded-full z-0"></div>

        <!-- ================= HEADER SECTION (HERO KARAKTER) ================= -->
        <!-- Memberikan tinggi pasti pada hero agar proporsional (450px) -->
        <header class="relative pt-12 px-6 pb-0 z-10 w-full h-[450px] flex-shrink-0 overflow-hidden flex flex-col items-center">
            
            <!-- Tipografi Latar Belakang Z-0 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center z-0 pointer-events-none select-none opacity-80 mt-8">
                <!-- Teks Sans-Serif Memanjang Vertikal -->
                <div class="font-bebas text-[110px] leading-[0.8] text-transparent tracking-tight flex flex-col items-center" style="-webkit-text-stroke: 1.5px rgba(65, 105, 225, 0.2); transform: scaleY(1.7);">
                    <span>NUSANTARA</span>
                    <span class="text-royal/5" style="-webkit-text-stroke: 1.5px rgba(65, 105, 225, 0.4);">NUSANTARA</span>
                </div>
                <!-- Teks Cursive Melintang -->
                <div class="absolute top-[40%] w-[120%] text-center font-cursive text-[70px] text-royal/40 -rotate-[8deg] transform -translate-y-1/2 drop-shadow-sm">
                    Nusantara
                </div>
            </div>

            <!-- Nameplate Info Profil (Nekomiya Style) Z-20 -->
            <div class="absolute top-12 left-5 z-20">
                <div class="flex items-stretch gap-2">
                    <!-- Bracket Kiri dengan Nomor Vertikal -->
                    <div class="relative w-2.5 border-t-2 border-b-2 border-l-2 border-dark">
                        <span class="absolute top-1/2 -left-2.5 transform -translate-y-1/2 -rotate-90 text-[7px] font-mono tracking-[0.2em] text-dark font-bold whitespace-nowrap">0 0 1</span>
                    </div>
                    
                    <!-- Teks Profil -->
                    <div class="py-0.5">
                        <p class="text-[7px] font-mono tracking-[0.2em] text-gray-500 mb-0.5 uppercase">Nusantara Archives</p>
                        <h1 class="text-3xl font-black font-display uppercase leading-[0.85] tracking-tighter text-dark">
                            NUSA<br>NTARA
                        </h1>
                        <p class="text-[9px] font-medium text-gray-600 mt-1.5 max-w-[120px] leading-snug">
                            Desainer, Kreator, dan Penggemar GFX.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Karakter di Tengah (Z-10) -->
            <img src="assets/images/character1.webp" 
                 alt="Karakter Nusantara" 
                 class="absolute bottom-0 w-[260px] max-w-[85%] object-contain z-10 drop-shadow-xl pointer-events-none">
        </header>

        <!-- ================= SECTION BUTTON / LINKS ================= -->
        <section class="relative flex-1 w-full flex flex-col gap-4 px-6 pt-6 pb-12 z-10">
            
            <!-- Link 1 (Primary / Yellow) -->
            <a href="#" class="btn-hover-fx block w-full bg-accent text-dark px-4 py-3.5 clip-button transition-colors hover:bg-white border-2 border-transparent hover:border-accent group shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="ph-bold ph-folder-star text-xl group-hover:animate-bounce"></i>
                        <span class="btn-text font-bold uppercase text-sm italic tracking-wide">Portofolio</span>
                    </div>
                    <i class="ph-bold ph-arrow-right text-sm"></i>
                </div>
            </a>

            <!-- Link 2 (Royal Blue) -->
            <a href="#" class="btn-hover-fx block w-full bg-royal text-white px-4 py-3.5 clip-button-reverse transition-colors hover:bg-white hover:text-royal border-2 border-transparent hover:border-royal group shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="ph-bold ph-instagram-logo text-xl group-hover:-rotate-12 transition-transform"></i>
                        <span class="btn-text font-bold uppercase text-sm italic tracking-wide">Instagram</span>
                    </div>
                    <i class="ph-bold ph-arrow-right text-sm"></i>
                </div>
            </a>

            <!-- Link 3 (Dark Theme) -->
            <a href="#" class="btn-hover-fx block w-full bg-dark text-white px-4 py-3.5 clip-button transition-colors hover:bg-gray-800 border-2 border-transparent hover:border-dark group shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="ph-bold ph-x-logo text-xl"></i>
                        <span class="btn-text font-bold uppercase text-sm italic tracking-wide">Twitter / X</span>
                    </div>
                    <i class="ph-bold ph-arrow-right text-sm"></i>
                </div>
            </a>

        </section>

        <!-- ================= NEW FOOTER SECTION ================= -->
        <footer class="relative w-full flex flex-col z-20 mt-auto">
            
            <!-- Wedge/Garis Biru Miring -->
            <div class="absolute -top-3 left-0 w-full h-12 bg-royal shadow-[0_-5px_15px_rgba(65,105,225,0.3)]" style="clip-path: polygon(0 100%, 100% 0, 100% 100%); z-10;"></div>
            
            <!-- Dark Container Footer -->
            <div class="relative bg-dark w-full flex flex-col pt-12 pb-6 px-6" style="clip-path: polygon(0 25px, 100% 0, 100% 100%, 0 100%); margin-top: -10px;">
                
                <!-- Title Footer -->
                <div class="flex justify-center items-center gap-3 mt-2 mb-4">
                    <!-- Icon 4 Garis (Sesuai gambar referensi) -->
                    <div class="flex flex-col gap-[3px] w-8 transform -skew-x-[15deg]">
                        <div class="h-[4px] w-full bg-white"></div>
                        <div class="h-[4px] w-[95%] bg-white"></div>
                        <div class="h-[4px] w-[75%] bg-white"></div>
                        <div class="h-[4px] w-full bg-white"></div>
                    </div>
                    <!-- Teks Judul -->
                    <h2 class="text-[28px] font-black font-display uppercase tracking-widest text-white leading-none mt-1">NUSANTARA</h2>
                </div>

                <!-- Copyright / Detail Bawah -->
                <div class="mt-4 pt-4 text-center font-mono text-[8px] text-gray-500 uppercase tracking-[0.15em] border-t border-gray-800/50">
                    © 2026 NUSANTARA. ALL RIGHTS RESERVED.
                </div>

            </div>
        </footer>

    </main>

</body>
</html>
